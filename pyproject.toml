[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-demo"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "html2text",
]

[project.scripts]
forge-demo = "forge_demo.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
